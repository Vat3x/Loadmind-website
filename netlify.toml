[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/3dplan"
  to = "https://3dloadplanning.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/3dplan/*"
  to = "https://3dloadplanning.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
