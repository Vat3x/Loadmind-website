[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/embed"
  to = "https://3dloadplanning.netlify.app/embed"
  status = 200
  force = true

[[redirects]]
  from = "/embed/*"
  to = "https://3dloadplanning.netlify.app/embed/:splat"
  status = 200
  force = true

# Legacy /tracker/* redirects → new subdomain (permanent)
[[redirects]]
  from = "/tracker/*"
  to = "https://tracking.load-mind.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tracker"
  to = "https://tracking.load-mind.com/"
  status = 301
  force = true


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
