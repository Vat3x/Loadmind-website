[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/app"
  to = "https://3d.loadmind.app/"
  status = 302

[[redirects]]
  from = "/app/*"
  to = "https://3d.loadmind.app/:splat"
  status = 302

[[redirects]]
  from = "/tracker"
  to = "https://tracking.loadmind.app/"
  status = 302

[[redirects]]
  from = "/tracker/*"
  to = "https://tracking.loadmind.app/:splat"
  status = 302

[[redirects]]
  from = "/embed"
  to = "https://3d.loadmind.app/embed"
  status = 302

[[redirects]]
  from = "/embed/*"
  to = "https://3d.loadmind.app/embed/:splat"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
