[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/app"
  to = "https://3dloadplanning.netlify.app/"
  status = 302

[[redirects]]
  from = "/app/*"
  to = "https://3dloadplanning.netlify.app/:splat"
  status = 302

[[redirects]]
  from = "/embed"
  to = "https://3dloadplanning.netlify.app/embed"
  status = 302

[[redirects]]
  from = "/embed/*"
  to = "https://3dloadplanning.netlify.app/embed/:splat"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
