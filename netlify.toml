[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/embed"
  to = "https://3dloadplanning.netlify.app/embed"
  status = 200
  force = true

[[redirects]]
  from = "/embed/*"
  to = "https://3dloadplanning.netlify.app/embed/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tracker/invite/*"
  to = "https://tracking-app-f6ad7.web.app/invite/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tracker/track/*"
  to = "https://tracking-app-f6ad7.web.app/track/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
