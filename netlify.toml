[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/embed"
  to = "https://3dloadplanning.netlify.app/embed"
  status = 200
  force = true

[[redirects]]
  from = "/embed/*"
  to = "https://3dloadplanning.netlify.app/embed/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tracker/invite/*"
  to = "https://tracking-app-f6ad7.web.app/invite/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tracker/track/*"
  to = "https://tracking-app-f6ad7.web.app/track/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tracker/register/*"
  to = "https://tracking-app-f6ad7.web.app/register/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tracker/register"
  to = "https://tracking-app-f6ad7.web.app/register"
  status = 200
  force = true

[[redirects]]
  from = "/tracker/auth/*"
  to = "https://tracking-app-f6ad7.web.app/auth/:splat"
  status = 200
  force = true

# Proxy Firebase dashboard assets (hashed filenames won't collide with Netlify's own assets)
[[redirects]]
  from = "/assets/*"
  to = "https://tracking-app-f6ad7.web.app/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
